<!DOCTYPE html>
<html>
<head>
    <title>Gunfight 2v2 Shooter</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #222; color: white; font-family: sans-serif; }
        canvas { border: 2px solid #444; background: #333; }
        #info { margin: 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h1>Gunfight Engine</h1>
        <p>Use WASD to move your circle. Green = you, Blue = teammate, Red = enemy.</p>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = new WebSocket("ws://localhost:8080");

        let localPlayerId = null;
        let players = [];
        let projectiles = [];
        const keys = {};
        const PLAYER_SIZE = 32;
        const PLAYER_RADIUS = PLAYER_SIZE / 2;
        const PROJECTILE_RADIUS = 4;
        const BAR_WIDTH = 32;
        const HEALTH_BAR_HEIGHT = 5;
        const AMMO_BAR_HEIGHT = 4;
        const BAR_GAP = 2;
        const BAR_OFFSET_Y = 12;


        socket.onopen = () => {
            console.log("Connected to server!");
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.players) {
                players = data.players;
                // Set local player ID from first received packet if not set
                if (localPlayerId === null && players.length > 0) {
                    localPlayerId = players[0].id;
                }
            }
            if (data.projectiles) {
                projectiles = data.projectiles;
            }
        };

        // WASD input handling
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            keys[e.key] = true;
            sendInput();
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            sendInput();
        });

        // Mouse tracking for aiming
        let mouseX = 0;
        let mouseY = 0;
        let isMouseDown = false;
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            sendInput();
        });
        
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            sendInput();
        });
        
        canvas.addEventListener('mouseup', (e) => {
            isMouseDown = false;
            sendInput();
        });

        function sendInput() {
            const packet = {
                moveUp: keys['w'] || false,
                moveDown: keys['s'] || false,
                moveLeft: keys['a'] || false,
                moveRight: keys['d'] || false,
                isFiring: isMouseDown,
                isReloading: keys['r'] || false,
                cursorX: mouseX,
                cursorY: mouseY
            };
            socket.send(JSON.stringify(packet));
        }

        function getPlayerColor(id) {
            if (id === localPlayerId) return '#00ff00'; // Green - local player
            // For 2v2: IDs 0,1 vs 2,3 - first two are team A, next two are team B
            const localTeam = Math.floor(localPlayerId / 2);
            const playerTeam = Math.floor(id / 2);
            if (localTeam === playerTeam) return '#0088ff'; // Blue - teammate
            return '#ff4444'; // Red - enemy
        }

        function render() {
            // Clear canvas
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw all players as circles
            for (const player of players) {
                if (player.dead) continue;

                const cx = player.x + PLAYER_RADIUS;
                const cy = player.y + PLAYER_RADIUS;

                ctx.fillStyle = getPlayerColor(player.id);
                ctx.beginPath();
                ctx.arc(cx, cy, PLAYER_RADIUS, 0, Math.PI * 2);
                ctx.fill();

                const barX = cx - BAR_WIDTH / 2;

                // Health bar (top bar)
                const healthBarY = player.y - BAR_OFFSET_Y - HEALTH_BAR_HEIGHT - BAR_GAP - AMMO_BAR_HEIGHT;
                if (player.maxHealth > 0) {
                    const hpRatio = Math.max(0, player.health / player.maxHealth);

                    ctx.fillStyle = '#555';
                    ctx.fillRect(barX, healthBarY, BAR_WIDTH, HEALTH_BAR_HEIGHT);

                    if (hpRatio > 0.5) {
                        ctx.fillStyle = '#44ff44';
                    } else if (hpRatio > 0.25) {
                        ctx.fillStyle = '#ffcc00';
                    } else {
                        ctx.fillStyle = '#ff4444';
                    }
                    ctx.fillRect(barX, healthBarY, BAR_WIDTH * hpRatio, HEALTH_BAR_HEIGHT);
                }

                // Ammo bar (below health bar)
                const ammoBarY = healthBarY + HEALTH_BAR_HEIGHT + BAR_GAP;
                if (player.maxAmmo > 0) {
                    const ammoRatio = player.ammo / player.maxAmmo;

                    let ratio;
                    if (player.reloading) {
                        ratio = ammoRatio + (1.0 - ammoRatio) * (player.reloadProgress || 0);
                    } else {
                        ratio = ammoRatio;
                    }

                    ctx.fillStyle = '#555';
                    ctx.fillRect(barX, ammoBarY, BAR_WIDTH, AMMO_BAR_HEIGHT);

                    if (ratio > 0.5) {
                        ctx.fillStyle = '#44ff44';
                    } else if (ratio > 0.25) {
                        ctx.fillStyle = '#ffcc00';
                    } else {
                        ctx.fillStyle = '#ff4444';
                    }
                    ctx.fillRect(barX, ammoBarY, BAR_WIDTH * ratio, AMMO_BAR_HEIGHT);
                }

                // Draw player ID label above both bars
                ctx.fillStyle = 'white';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(player.id, cx, healthBarY - 4);
            }

            // Draw all projectiles as small yellow circles
            ctx.fillStyle = '#ffff00';
            for (const projectile of projectiles) {
                ctx.beginPath();
                ctx.arc(projectile.x, projectile.y, PROJECTILE_RADIUS, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(render);
        }

        // Start render loop
        render();
    </script>
</body>
</html>
