<!DOCTYPE html>
<html>
<head>
    <title>Gunfight 2v2 Shooter</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #222; color: white; font-family: sans-serif; }
        canvas { border: 2px solid #444; background: #333; }
        #info { margin: 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h1>Gunfight Engine</h1>
        <p>Use WASD to move your circle. Green = you, Blue = teammate, Red = enemy.</p>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = new WebSocket("ws://localhost:8080");

        let localPlayerId = null;
        let players = [];
        let projectiles = [];
        const keys = {};
        const PLAYER_SIZE = 32;
        const PLAYER_RADIUS = PLAYER_SIZE / 2;
        const PROJECTILE_RADIUS = 4;

        socket.onopen = () => {
            console.log("Connected to server!");
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.players) {
                players = data.players;
                // Set local player ID from first received packet if not set
                if (localPlayerId === null && players.length > 0) {
                    localPlayerId = players[0].id;
                }
            }
            if (data.projectiles) {
                projectiles = data.projectiles;
            }
        };

        // WASD input handling
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            keys[e.key] = true;
            sendInput();
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            sendInput();
        });

        // Mouse tracking for aiming
        let mouseX = 0;
        let mouseY = 0;
        let isMouseDown = false;
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            sendInput();
        });
        
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            sendInput();
        });
        
        canvas.addEventListener('mouseup', (e) => {
            isMouseDown = false;
            sendInput();
        });

        function sendInput() {
            const packet = {
                moveUp: keys['w'] || false,
                moveDown: keys['s'] || false,
                moveLeft: keys['a'] || false,
                moveRight: keys['d'] || false,
                isFiring: isMouseDown,
                cursorX: mouseX,
                cursorY: mouseY
            };
            socket.send(JSON.stringify(packet));
        }

        function getPlayerColor(id) {
            if (id === localPlayerId) return '#00ff00'; // Green - local player
            // For 2v2: IDs 0,1 vs 2,3 - first two are team A, next two are team B
            const localTeam = Math.floor(localPlayerId / 2);
            const playerTeam = Math.floor(id / 2);
            if (localTeam === playerTeam) return '#0088ff'; // Blue - teammate
            return '#ff4444'; // Red - enemy
        }

        function render() {
            // Clear canvas
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw all players as circles
            for (const player of players) {
                ctx.fillStyle = getPlayerColor(player.id);
                ctx.beginPath();
                // Center the circle on the position (position is top-left, so add radius)
                ctx.arc(player.x + PLAYER_RADIUS, player.y + PLAYER_RADIUS, PLAYER_RADIUS, 0, Math.PI * 2);
                ctx.fill();

                // Draw player ID label above the circle
                ctx.fillStyle = 'white';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(player.id, player.x + PLAYER_RADIUS, player.y - 5);
            }

            // Draw all projectiles as small yellow circles
            ctx.fillStyle = '#ffff00';
            for (const projectile of projectiles) {
                ctx.beginPath();
                ctx.arc(projectile.x, projectile.y, PROJECTILE_RADIUS, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(render);
        }

        // Start render loop
        render();
    </script>
</body>
</html>
